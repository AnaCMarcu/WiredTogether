[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hebbian-marl"
version = "0.1.0"
description = "Hebbian-modulated social plasticity on Level-Based Foraging — thesis chapter testbed"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
authors = [{ name = "Ana Marcu" }]

# Versions pinned exactly to what the Phase 0 smoke test (MAPPO 50k steps on
# Foraging-10x10-3p-3f-v3) was validated against. Bump deliberately — EPyMARL
# pins PyYAML==5.3.1 which won't build on Python 3.10+, so this set diverges
# from upstream's requirements.txt by necessity.
dependencies = [
    # EPyMARL core
    "numpy==1.26.4",
    "torch==2.12.0",
    "torchvision==0.27.0",
    "sacred==0.8.7",
    "PyYAML==6.0.3",
    "tensorboard-logger==0.1.0",
    "pyparsing>=3.0",
    "probscale==0.2.5",
    "imageio==2.37.3",
    "matplotlib==3.10.9",
    "seaborn==0.13.2",
    "scipy==1.17.1",
    "Pillow==12.2.0",
    "pygame==2.6.1",
    "websocket-client==1.9.0",
    "wrapt==1.17.3",
    "absl-py==2.4.0",
    "attrs==26.1.0",
    "click==8.4.0",
    "pluggy==1.6.0",
    "portpicker==1.6.0",
    "requests==2.34.2",
    "tornado==6.5.5",
    # MARL env
    "gymnasium==1.3.0",
    "lbforaging==2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
    "ruff",
]

# We don't ship an importable `hebbian_marl` package — code lives under
# `epymarl/src/` and is invoked by path (matching EPyMARL convention).
# This block tells setuptools to install dependencies only.
[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra"
