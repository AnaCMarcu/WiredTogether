# --- MAPPO + uniform-weighted reward diffusion (control) ---
#
# Control variant for the Hebbian thesis claim. Identical to
# `mappo_hebbian_r.yaml` except the bond matrix is forced to uniform
# (W̄[i,j] = 1/(N-1)) and the spatial co-activity gate is disabled,
# yielding pure uniform per-agent reward sharing at intensity γ.
#
# Why this is the right control: `mappo_hebbian_r` reshapes per-agent
# rewards via the *learned* Hebbian bond structure modulated by spatial
# co-activity. If we also reshape rewards with a *trivial* (uniform,
# ungated) structure, the comparison isolates the thesis claim:
#
#     learned social affiliation drives cooperation,
#     beyond what any uniform reward-sharing would deliver.
#
# Concretely, this variant computes:
#     r'_i(t) = (1-γ)·r_i(t) + γ · (1/(N-1)) · Σ_{j≠i} r_j(t)
#
# Same γ as mappo_hebbian_r (0.2). The Hebbian module is technically
# `enabled: True` so the runner path is identical to mappo_hebbian_r —
# but `uniform_weights: True` short-circuits the learned W in
# get_normalized_weights, and `disable_coactivity_gate: True` makes the
# diffusion equation ignore c[i,j]. This is a strict ablation: same
# code path, same hyperparameters, only the W̄·c factor changes.

action_selector: "soft_policies"
mask_before_softmax: True

runner: "hebbian_parallel"

buffer_size: 10
batch_size_run: 10
batch_size: 10

target_update_interval_or_tau: 0.01

lr: 0.0003
hidden_dim: 128

obs_agent_id: True
obs_last_action: False
obs_individual_obs: False

agent_output_type: "pi_logits"
learner: "ppo_learner"
entropy_coef: 0.001
use_rnn: True
standardise_returns: False
standardise_rewards: True
q_nstep: 5
critic_type: "cv_critic"
epochs: 4
eps_clip: 0.2
name: "mappo_hebbian_uniform_r"

t_max: 3050000

common_reward: False
reward_scalarisation: "sum"

hebbian:
  enabled: True
  reward_diffusion: True
  uniform_weights: True            # ← W̄ = 1/(N-1), ignoring learned bonds
  disable_coactivity_gate: True    # ← c[i,j] = 1, ignoring spatial gating
  weighted_sharing: False
  uniform_sharing: False
  policy_mixture: False
  num_agents: 3
  interaction_radius: 2.0
