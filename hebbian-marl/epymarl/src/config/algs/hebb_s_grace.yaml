# hebb_s_grace — hebb_s + failure-grace period.
#
# Same as hebb_s but with the additive failure-grace LTP bonus enabled.
# When the team is failing and the pair's F_ij is below the grace
# threshold, the bond GROWS (we tried something together). Past
# threshold, the bonus is zero and the existing sustained LTD takes
# over — the bond starts to shrink. See HebbianConfig.failure_grace_*.

action_selector: "soft_policies"
mask_before_softmax: True

runner: "hebbian"
batch_size_run: 1
buffer_size: 32
batch_size: 32

target_update_interval_or_tau: 200
lr: 0.0003

obs_agent_id: False
obs_last_action: False
obs_individual_obs: False

mac: "non_shared_mac"
agent: "rnn_ns"
agent_output_type: "pi_logits"
learner: "hebbian_seac_learner"
entropy_coef: 0.01
standardise_returns: False
standardise_rewards: True
use_rnn: False
epochs: 4
eps_clip: 0.2
q_nstep: 5
critic_type: "ac_critic_ns"
name: "hebb_s_grace"

t_max: 5050000

uniform_sharing: False
weighted_sharing: True
lambda_share: 0.5

hebbian:
  enabled: True
  reward_diffusion: False
  weighted_sharing: True
  policy_mixture: False
  num_agents: 3
  interaction_radius: 2.0
  communication_coactivity_bonus: 0.5
  # Failure-grace period — opt-in extension of the legacy update rule.
  failure_grace_enabled: True
  failure_grace_threshold: 0.3
  failure_ltp_lr: 0.015
