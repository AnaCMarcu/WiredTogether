# --- MAPPO + Hebbian social plasticity ---
#
# Same MAPPO stack as upstream `mappo.yaml` (cv_critic, basic_mac, rnn,
# parallel rollouts with batch_size_run=10), but routed through
# `HebbianParallelRunner` so each parallel env-step updates a single
# shared Hebbian social graph and (optionally) diffuses per-agent rewards
# before they hit the batch.
#
# Why MAPPO is compatible with per-agent Hebbian:
# `ppo_learner.py` uses `common_reward` only to decide whether to expand
# scalar rewards across agents. With `common_reward: False`, per-agent
# rewards are preserved and the cv_critic's V(s) is broadcast across
# agents, yielding per-agent n-step returns → per-agent advantages. The
# Hebbian-SEAC IS-corrected sharing reads those advantages, so the
# central-critic vs. decentralized-critic choice is orthogonal.
#
# With all `hebbian.*` flags False, this config is bitwise-equivalent to
# canonical MAPPO + common_reward=False (the HebbianParallelRunner falls
# back to ParallelRunner behavior).

action_selector: "soft_policies"
mask_before_softmax: True

runner: "hebbian_parallel"

buffer_size: 10
batch_size_run: 10
batch_size: 10

target_update_interval_or_tau: 0.01

lr: 0.0003
hidden_dim: 128

obs_agent_id: True
obs_last_action: False
obs_individual_obs: False

agent_output_type: "pi_logits"
learner: "ppo_learner"
entropy_coef: 0.001
use_rnn: True
standardise_returns: False
standardise_rewards: True
q_nstep: 5
critic_type: "cv_critic"
epochs: 4
eps_clip: 0.2
name: "mappo_hebbian"

t_max: 3050000

# Per-agent rewards are required for the Hebbian update (positions +
# per-agent rewards feed into the graph) and for the SEAC-style
# IS-corrected sharing the Hebbian-weighted variant uses. Set here so
# the config is correct even when launched with `--env-config=gymma`
# (which defaults `common_reward: True`).
common_reward: False
reward_scalarisation: "sum"

# Hebbian feature flags. Master switch off by default so this config is
# a strict no-op wrt canonical MAPPO. Variant YAMLs (mappo_hebbian_s.yaml,
# mappo_hebbian_r.yaml, ...) can flip the relevant flags.
hebbian:
  enabled: False
  reward_diffusion: False
  weighted_sharing: False
  uniform_sharing: False
  policy_mixture: False
  num_agents: 3
  interaction_radius: 2.0
