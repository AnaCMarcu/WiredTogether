# SEAC baseline — uniform-weighted off-policy sharing.
#
# Per-agent networks (no parameter sharing), feed-forward, IS-corrected
# cross-agent term with uniform weight 1/(N-1). What `hebb_s` must beat.

action_selector: "soft_policies"
mask_before_softmax: True

runner: "hebbian"            # runs the no-op hebbian runner for log parity
batch_size_run: 1
buffer_size: 32
batch_size: 32

target_update_interval_or_tau: 200
lr: 0.0003

obs_agent_id: False
obs_last_action: False
obs_individual_obs: False

mac: "non_shared_mac"
agent: "rnn_ns"
agent_output_type: "pi_logits"
learner: "hebbian_seac_learner"
entropy_coef: 0.01
standardise_returns: False
standardise_rewards: True
use_rnn: False
epochs: 4
eps_clip: 0.2
q_nstep: 5
critic_type: "ac_critic_ns"
name: "seac"

t_max: 5050000

# SEAC sharing parameters
uniform_sharing: True
weighted_sharing: False
lambda_share: 0.5

hebbian:
  enabled: False             # SEAC doesn't use the Hebbian graph
  reward_diffusion: False
  num_agents: 3
