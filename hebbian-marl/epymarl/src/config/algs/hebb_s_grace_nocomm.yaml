# hebb_s_grace_nocomm — Hebbian-weighted sharing + failure-grace + δ_comm = 0.
#
# The matching ablation for the headline `hebb_s_grace` variant. Same
# grace-period LTP bonus on failures, but the cross-distance comm term
# of the co-activity signal is ablated — so headline claim 2
# (`hebb_s_grace > hebb_s_grace_nocomm`) tests whether the comm path
# carries real learning signal *within the grace-enabled regime*.

action_selector: "soft_policies"
mask_before_softmax: True

runner: "hebbian"
batch_size_run: 1
buffer_size: 32
batch_size: 32

target_update_interval_or_tau: 200
lr: 0.0003

obs_agent_id: False
obs_last_action: False
obs_individual_obs: False

mac: "non_shared_mac"
agent: "rnn_ns"
agent_output_type: "pi_logits"
learner: "hebbian_seac_learner"
entropy_coef: 0.01
standardise_returns: False
standardise_rewards: True
use_rnn: False
epochs: 4
eps_clip: 0.2
q_nstep: 5
critic_type: "ac_critic_ns"
name: "hebb_s_grace_nocomm"

t_max: 5050000

uniform_sharing: False
weighted_sharing: True
lambda_share: 0.5

hebbian:
  enabled: True
  reward_diffusion: False
  weighted_sharing: True
  policy_mixture: False
  num_agents: 3
  interaction_radius: 2.0
  communication_coactivity_bonus: 0.0   # ablated: no cross-distance comm term
  # Failure-grace period — same as hebb_s_grace.
  failure_grace_enabled: True
  failure_grace_threshold: 0.3
  failure_ltp_lr: 0.015
