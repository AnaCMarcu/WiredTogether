defaults:
  env_config: lbf_comm
  env_key: Foraging-Comm-10x10-3p-3f-v3
  time_limit: 50
  # Reduced from 5M to 3M after the first HPC tier-1 attempt: compute-p1 nodes
  # run at ~48 steps/sec (vs. ~800 on the laptop), so 5M wouldn't fit even
  # in a 24h budget. 3M @ 48 steps/sec ≈ 17.4h, comfortably inside 24h.
  t_max: 3000000
  seeds: [0, 1, 2, 3, 4]
  use_cuda: false

experiments:

  # ── Tier 0 — Diagnostic runs (run BEFORE the headline grid) ────────────
  # Smoke-test data showed bonds collapsing from 0.27 (peak ~5k steps) to
  # 0.00 (dead by ~35k) in every Hebbian variant. The plan's §1.3 design
  # rationale assumes the Hebbian feedback loop closes fast enough to keep
  # signaling reinforced; the smoke data suggests it doesn't. These four
  # single-seed 500k runs distinguish three competing interpretations:
  #
  #   1. "Needs more training time"  → bonds will recover in diag_hebb_s_500k
  #   2. "Feedback loop too indirect for sharing" → diag_hebb_r_500k recovers
  #      where diag_hebb_s_500k doesn't (shorter loop closes, longer one doesn't)
  #   3. "Combination bootstraps"    → diag_hebb_rs_500k beats both individually
  #   4. "Env too small/sparse"      → diag_hebb_s_500k_bigenv differs materially
  #
  # Read the bonds/<label>/seed_0.jsonl trajectory + signal_total over t_env
  # in sacred metrics. Decide which interpretation fits BEFORE running tier 1.

  - variant: hebb_s
    label: diag_hebb_s_500k
    tier: 0
    seeds: [0]
    t_max: 500000
    rationale: "diagnostic 1 — does hebb_s self-correct given 10× the smoke budget?"

  - variant: hebb_r
    label: diag_hebb_r_500k
    tier: 0
    seeds: [0]
    t_max: 500000
    rationale: "diagnostic 2 — does the shorter reward-diffusion feedback loop close?"

  - variant: hebb_rs
    label: diag_hebb_rs_500k
    tier: 0
    seeds: [0]
    t_max: 500000
    rationale: "diagnostic 3 — does (a)+(b) combined bootstrap where either alone fails?"

  - variant: hebb_s
    label: diag_hebb_s_500k_bigenv
    tier: 0
    seeds: [0]
    t_max: 500000
    env_key: Foraging-Comm-15x15-3p-4f-v3
    rationale: "diagnostic 4 — does a bigger map + extra food materially change the dynamics?"

  - variant: hebb_s_grace
    label: diag_hebb_s_grace_500k
    tier: 0
    seeds: [0]
    t_max: 500000
    rationale: "diagnostic 5 — does additive failure-LTP grace prevent bond collapse without saturating? Promote to tier 1 only if bonds stay in (0.05, 0.95) AND total_return_mean is non-inferior to diag_hebb_s_500k."

  # ── Tier 1 — Headline statistical claims ─────────────────────────────
  # The failure-grace mechanism is now part of the canonical Hebbian
  # update rule (HebbianConfig.failure_grace_enabled defaults to True),
  # so the base hebb_* variants ARE the grace-enabled variants. No
  # separate _grace YAMLs needed.
  #
  # Six variants × 5 seeds = 30 runs:
  #   - hebb_s         headline: sharing only (Hebbian update incl. grace)
  #   - hebb_r         treatment: reward diffusion only
  #   - hebb_rs        treatment: (a) + (b) combined
  #   - seac           baseline: uniform sharing, no Hebbian
  #   - ippo_baseline  floor: no sharing, no Hebbian
  #   - hebb_s_nocomm  ablation: hebb_s with delta_comm=0
  #
  # Pre-registered paired-seed Wilcoxon tests (plot_results.py):
  #   1) hebb_s  > seac           — does Hebbian-weighted sharing beat uniform?
  #   2) hebb_s  > ippo_baseline  — does Hebbian-weighted sharing beat no-sharing?
  #   3) hebb_s  > hebb_s_nocomm  — does the comm term carry signal?
  #   4) hebb_rs > seac           — does the full stack beat uniform?
  #   5) hebb_rs > hebb_s         — does (a)+(b) beat (b) alone?

  - variant: hebb_s
    tier: 1
    rationale: "headline — Hebbian-weighted sharing"

  - variant: hebb_r
    tier: 1
    rationale: "treatment — reward diffusion only"

  - variant: hebb_rs
    tier: 1
    rationale: "treatment — sharing + reward diffusion"

  - variant: seac
    tier: 1
    rationale: "baseline — uniform SEAC sharing (must-beat for claim 1)"

  - variant: ippo_baseline
    tier: 1
    rationale: "floor — IPPO with no sharing and no Hebbian mechanism"

  - variant: hebb_s_nocomm
    tier: 1
    rationale: "ablation — hebb_s with delta_comm=0 (comm-term carrier test)"

  # ── Tier 2 — Component validation ─────────────────────────────────────
  # Needed to interpret tier-1 results: isolate reward diffusion,
  # check super-additivity, and verify the spatial gate is load-bearing.

  - variant: hebb_r
    tier: 2
    rationale: "isolates integration (a) reward diffusion without sharing"

  - variant: hebb_rs
    tier: 2
    rationale: "(a)+(b) combined — checks for additive vs interfering effects"

  - variant: hebb_s_commonly
    tier: 2
    rationale: "ablates the 3D spatial gate of Hebbian co-activity"

  # ── Tier 3 — Context baselines ────────────────────────────────────────
  # Anchor the y-axis: no-sharing floor and the standard cooperative method.

  - variant: ippo_baseline
    tier: 3
    rationale: "no-sharing floor (per-agent IPPO, Hebbian module disabled)"

  - variant: mappo
    tier: 3
    rationale: "standard cooperative param-sharing baseline"

  # ── Tier 5 — Preview pass (run AFTER tier 0, BEFORE tier 1) ────────────
  # Single-seed 1M-step comparison of the five "main contenders" on the
  # default env. Establishes the relative ordering before committing 5
  # seeds × 5M to tier 1 (~3-4h at parallel=2).
  #
  # Read: bonds for mechanism health, total_return_mean for policy quality.
  # If hebb_s >> seac and ippo_baseline at 1M, tier 1 is well-positioned.
  # If everything bunches up, headline claim 1 is at risk — revisit before
  # burning ~30h on tier 1.

  - variant: hebb_s
    label: preview_hebb_s
    tier: 5
    seeds: [0]
    t_max: 1000000
    rationale: "preview — headline variant at 1M"

  - variant: hebb_r
    label: preview_hebb_r
    tier: 5
    seeds: [0]
    t_max: 1000000
    rationale: "preview — reward diffusion alone at 1M"

  - variant: hebb_rs
    label: preview_hebb_rs
    tier: 5
    seeds: [0]
    t_max: 1000000
    rationale: "preview — (a)+(b) combined at 1M"

  - variant: seac
    label: preview_seac
    tier: 5
    seeds: [0]
    t_max: 1000000
    rationale: "preview — uniform sharing baseline at 1M"

  - variant: ippo_baseline
    label: preview_ippo_baseline
    tier: 5
    seeds: [0]
    t_max: 1000000
    rationale: "preview — no-sharing IPPO floor at 1M"

  # ── Tier 6 — Sanity / pipeline diagnostic ─────────────────────────────
  # Tier-1 (5-seed headline grid) collapsed: all four variants degrade
  # from ~0.06 -> ~0.01 test return over 3M steps; final-window means
  # are statistically indistinguishable. Before launching another sweep
  # we need to know WHICH layer is broken. Three single-seed ippo_baseline
  # runs at 1M steps, ordered to isolate the failure mode:
  #
  #   0) sanity_plain_easy   — plain lbforaging via gymma, no comm wrapper,
  #                            on the canonical easy map. Reference: EPyMARL
  #                            paper IPPO hits ~0.8 on 8x8-2p-2f-coop by 2M.
  #                            If THIS fails, the training pipeline itself
  #                            is broken (config, torch, sacred, ...).
  #
  #   1) sanity_comm_easy    — same easy map but THROUGH the lbf_comm
  #                            wrapper. If sanity_plain_easy passed but
  #                            this fails, the comm wrapper is the culprit
  #                            (cf. the `reward returned as <class 'list'>`
  #                            warning at start of every tier-1 log).
  #
  #   2) sanity_horizon      — original failed env, but time_limit=100
  #                            (2x the tier-1 config). If 0 and 1 pass but
  #                            this fails, 10x10-3p-3f-v3 is too sparse
  #                            for 50-step horizons; bump to 100 for tier 1.
  #
  # Submit:
  #   sbatch --array=0-2 scripts/slurm/hebb_tier6.sh

  - variant: ippo_baseline
    label: sanity_plain_easy
    tier: 6
    seeds: [0]
    t_max: 1000000
    time_limit: 25
    env_config: gymma
    env_key: "lbforaging:Foraging-8x8-2p-2f-coop-v3"
    rationale: "sanity — plain lbforaging, no comm wrapper. EPyMARL reference IPPO hits ~0.8 by 2M on this map; failure here indicates a pipeline-level bug."

  - variant: ippo_baseline
    label: sanity_comm_easy
    tier: 6
    seeds: [0]
    t_max: 1000000
    time_limit: 25
    env_config: lbf_comm
    env_key: "Foraging-Comm-8x8-2p-2f-v3"
    rationale: "sanity — same easy map but through the lbf_comm wrapper. Isolates whether the comm wrapper itself breaks training (vs. sanity_plain_easy)."

  - variant: ippo_baseline
    label: sanity_horizon
    tier: 6
    seeds: [0]
    t_max: 1000000
    time_limit: 100
    env_config: lbf_comm
    env_key: "Foraging-Comm-10x10-3p-3f-v3"
    rationale: "sanity — original failed env with 2x horizon. Tests whether tier-1's time_limit=50 was the constraint."

  # ── Tier 7 — MAPPO sanity (canonical EPyMARL config, unchanged) ────────
  # Tier 6 showed `ippo_baseline` reaches exactly 0.0 return on 8x8-2p-2f-coop
  # by 100k steps, with `pi_max` saturating to 0.999 — i.e. policy collapses
  # to deterministic before exploration finds any reward. Possible causes:
  # (a) the `runner: hebbian` codepath (used by ippo_baseline.yaml), (b) the
  # `common_reward: False / reward_scalarisation: sum` setup the lbf_comm
  # env-config forces, or (c) something else in the fork.
  #
  # Tier 7 swaps to the canonical EPyMARL `mappo` config + `gymma` env-config,
  # i.e. exactly the code path the EPyMARL paper used. `mappo.yaml` is
  # unchanged from upstream (parallel runner, cv_critic, shared MAC, RNN,
  # batch_size_run=10), and `gymma` defaults to `common_reward: True`.
  # This is the same invocation pattern as scripts/verify_baseline.sh, just
  # at 1M steps instead of 50k.
  #
  # Indices:
  #   0  sanity_mappo_plain_easy  canonical reference: 8x8-2p-2f-coop, T=25.
  #                               EPyMARL paper IPPO/MAPPO hits ~0.8 here.
  #                               Failure ⇒ pipeline-level bug in this fork.
  #   1  sanity_mappo_plain_hard  10x10-3p-3f via gymma (no comm wrapper),
  #                               T=50. Same map as tier-1, but standard
  #                               MAPPO + cooperative-sum reward.
  #   2  sanity_mappo_comm        Foraging-Comm-10x10-3p-3f-v3 via lbf_comm,
  #                               T=50. Same as tier-1's failed env, but
  #                               with MAPPO instead of ippo_baseline.
  #                               (Note: lbf_comm forces common_reward=False,
  #                               which diverges from upstream — included
  #                               only to isolate the lbf_comm wrapper.)
  #
  # Wall-time: mappo's parallel runner with batch_size_run=10 should reach
  # 1M env steps in ~1–2h on compute-p1. SLURM budget set to 4h with margin.
  #
  # Submit:
  #   sbatch --array=0-2 scripts/slurm/hebb_tier7.sh

  - variant: mappo
    label: sanity_mappo_plain_easy
    tier: 7
    seeds: [0]
    t_max: 1000000
    time_limit: 25
    env_config: gymma
    env_key: "lbforaging:Foraging-8x8-2p-2f-coop-v3"
    rationale: "sanity — canonical EPyMARL MAPPO on the reference easy LBF map. If this fails, the fork's epymarl is broken at the framework level."

  - variant: mappo
    label: sanity_mappo_plain_hard
    tier: 7
    seeds: [0]
    t_max: 1000000
    time_limit: 50
    env_config: gymma
    env_key: "lbforaging:Foraging-10x10-3p-3f-v3"
    rationale: "sanity — canonical MAPPO on the tier-1 map without the comm wrapper. Isolates map difficulty from wrapper interactions."

  - variant: mappo
    label: sanity_mappo_comm
    tier: 7
    seeds: [0]
    t_max: 1000000
    time_limit: 50
    env_config: lbf_comm
    env_key: "Foraging-Comm-10x10-3p-3f-v3"
    rationale: "sanity — MAPPO through the lbf_comm wrapper on the tier-1 env. Note lbf_comm forces common_reward=False; included to isolate the wrapper as the culprit if tier 7.0 and 7.1 pass."

  # ── Tier 8 — MAPPO + HebbianParallelRunner smoke ──────────────────────
  # Tier 7 showed canonical MAPPO + common_reward=True learns to 0.74 on
  # 10x10-3p-3f. Tier 8 verifies the new HebbianParallelRunner is a strict
  # no-op when hebbian.enabled=False — i.e. that the runner port itself
  # doesn't break MAPPO. Difference from tier 7.1 (sanity_mappo_plain_hard):
  #
  #   - new `mappo_hebbian` alg config (HebbianParallelRunner + per-agent
  #     rewards via common_reward=False)
  #   - uses lbf_comm env (the Hebbian variants need this env anyway, and
  #     this also exercises the list-valued-info-keys fix in the new
  #     runner — same wrapper that crashed sanity_mappo_comm in tier 7)
  #
  # Expected: learns at roughly the same trajectory as sanity_mappo_plain_hard
  # (canonical MAPPO + common_reward=True on the same 10x10 map). A modest
  # delta is acceptable because per-agent vs. summed rewards changes the
  # advantage shape and lbf_comm adds a comm channel; a collapse to ~0.01
  # would indicate a bug in the new runner.
  #
  # Submit:
  #   sbatch --array=0 scripts/slurm/hebb_tier8.sh

  - variant: mappo_hebbian
    label: sanity_mappo_hebbian_offflags
    tier: 8
    seeds: [0]
    t_max: 1000000
    time_limit: 50
    env_config: lbf_comm
    env_key: "Foraging-Comm-10x10-3p-3f-v3"
    rationale: "sanity — MAPPO routed through HebbianParallelRunner with all hebbian flags off + per-agent rewards. Must learn (or the runner port has a bug). Also exercises the list-valued-info-keys fix that crashed tier 7.2."
