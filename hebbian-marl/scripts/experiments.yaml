defaults:
  env_config: lbf_comm
  env_key: Foraging-Comm-10x10-3p-3f-v3
  time_limit: 50
  # Reduced from 5M to 3M after the first HPC tier-1 attempt: compute-p1 nodes
  # run at ~48 steps/sec (vs. ~800 on the laptop), so 5M wouldn't fit even
  # in a 24h budget. 3M @ 48 steps/sec ≈ 17.4h, comfortably inside 24h.
  t_max: 3000000
  seeds: [0, 1, 2, 3, 4]
  use_cuda: false

experiments:

  # ── Tier 0 — Diagnostic runs (run BEFORE the headline grid) ────────────
  # Smoke-test data showed bonds collapsing from 0.27 (peak ~5k steps) to
  # 0.00 (dead by ~35k) in every Hebbian variant. The plan's §1.3 design
  # rationale assumes the Hebbian feedback loop closes fast enough to keep
  # signaling reinforced; the smoke data suggests it doesn't. These four
  # single-seed 500k runs distinguish three competing interpretations:
  #
  #   1. "Needs more training time"  → bonds will recover in diag_hebb_s_500k
  #   2. "Feedback loop too indirect for sharing" → diag_hebb_r_500k recovers
  #      where diag_hebb_s_500k doesn't (shorter loop closes, longer one doesn't)
  #   3. "Combination bootstraps"    → diag_hebb_rs_500k beats both individually
  #   4. "Env too small/sparse"      → diag_hebb_s_500k_bigenv differs materially
  #
  # Read the bonds/<label>/seed_0.jsonl trajectory + signal_total over t_env
  # in sacred metrics. Decide which interpretation fits BEFORE running tier 1.

  - variant: hebb_s
    label: diag_hebb_s_500k
    tier: 0
    seeds: [0]
    t_max: 500000
    rationale: "diagnostic 1 — does hebb_s self-correct given 10× the smoke budget?"

  - variant: hebb_r
    label: diag_hebb_r_500k
    tier: 0
    seeds: [0]
    t_max: 500000
    rationale: "diagnostic 2 — does the shorter reward-diffusion feedback loop close?"

  - variant: hebb_rs
    label: diag_hebb_rs_500k
    tier: 0
    seeds: [0]
    t_max: 500000
    rationale: "diagnostic 3 — does (a)+(b) combined bootstrap where either alone fails?"

  - variant: hebb_s
    label: diag_hebb_s_500k_bigenv
    tier: 0
    seeds: [0]
    t_max: 500000
    env_key: Foraging-Comm-15x15-3p-4f-v3
    rationale: "diagnostic 4 — does a bigger map + extra food materially change the dynamics?"

  - variant: hebb_s_grace
    label: diag_hebb_s_grace_500k
    tier: 0
    seeds: [0]
    t_max: 500000
    rationale: "diagnostic 5 — does additive failure-LTP grace prevent bond collapse without saturating? Promote to tier 1 only if bonds stay in (0.05, 0.95) AND total_return_mean is non-inferior to diag_hebb_s_500k."

  # ── Tier 1 — Headline statistical claims (failure-grace mechanism) ────
  # All Hebbian arms use failure_grace_enabled=True. The legacy `hebb_s`
  # mechanism collapsed bonds on 4/5 seeds in the first HPC attempt; the
  # grace bonus keeps them stable (confirmed in diag_hebb_s_grace_500k
  # and hebb_rs_grace_seed0).
  #
  # Six variants × 5 seeds = 30 runs:
  #   - hebb_s_grace         headline: sharing only + grace
  #   - hebb_r_grace         treatment: reward diffusion only + grace
  #   - hebb_rs_grace        treatment: (a) + (b) combined + grace
  #   - seac                 baseline: uniform sharing, no Hebbian
  #   - ippo_baseline        floor: no sharing, no Hebbian
  #   - hebb_s_grace_nocomm  ablation: hebb_s_grace with delta_comm=0
  #
  # Pre-registered paired-seed Wilcoxon tests (plot_results.py):
  #   1) hebb_s_grace  > seac                  — does Hebbian+grace beat uniform?
  #   2) hebb_s_grace  > ippo_baseline         — does Hebbian+grace beat no-sharing?
  #   3) hebb_s_grace  > hebb_s_grace_nocomm   — does the comm term carry signal?
  #   4) hebb_rs_grace > seac                  — does the full stack beat uniform?
  #   5) hebb_rs_grace > hebb_s_grace          — does (a)+(b) beat (b) alone?

  - variant: hebb_s_grace
    tier: 1
    rationale: "headline — sharing only + failure-grace LTP"

  - variant: hebb_r_grace
    tier: 1
    rationale: "treatment — reward diffusion only + failure-grace LTP"

  - variant: hebb_rs_grace
    tier: 1
    rationale: "treatment — sharing + reward diffusion + failure-grace LTP"

  - variant: seac
    tier: 1
    rationale: "baseline — uniform SEAC sharing (must-beat for claim 1)"

  - variant: ippo_baseline
    tier: 1
    rationale: "floor — IPPO with no sharing and no Hebbian mechanism"

  - variant: hebb_s_grace_nocomm
    tier: 1
    rationale: "ablation — hebb_s_grace with delta_comm=0 (comm-term carrier test)"

  # ── Tier 2 — Component validation ─────────────────────────────────────
  # Needed to interpret tier-1 results: isolate reward diffusion,
  # check super-additivity, and verify the spatial gate is load-bearing.

  - variant: hebb_r
    tier: 2
    rationale: "isolates integration (a) reward diffusion without sharing"

  - variant: hebb_rs
    tier: 2
    rationale: "(a)+(b) combined — checks for additive vs interfering effects"

  - variant: hebb_s_commonly
    tier: 2
    rationale: "ablates the 3D spatial gate of Hebbian co-activity"

  # ── Tier 3 — Context baselines ────────────────────────────────────────
  # Anchor the y-axis: no-sharing floor and the standard cooperative method.

  - variant: ippo_baseline
    tier: 3
    rationale: "no-sharing floor (per-agent IPPO, Hebbian module disabled)"

  - variant: mappo
    tier: 3
    rationale: "standard cooperative param-sharing baseline"

  # ── Tier 5 — Preview pass (run AFTER tier 0, BEFORE tier 1) ────────────
  # Single-seed 1M-step comparison of the five "main contenders" on the
  # default env. Establishes the relative ordering before committing 5
  # seeds × 5M to tier 1 (~3-4h at parallel=2).
  #
  # Read: bonds for mechanism health, total_return_mean for policy quality.
  # If hebb_s >> seac and ippo_baseline at 1M, tier 1 is well-positioned.
  # If everything bunches up, headline claim 1 is at risk — revisit before
  # burning ~30h on tier 1.

  - variant: hebb_s
    label: preview_hebb_s
    tier: 5
    seeds: [0]
    t_max: 1000000
    rationale: "preview — headline variant at 1M"

  - variant: hebb_r
    label: preview_hebb_r
    tier: 5
    seeds: [0]
    t_max: 1000000
    rationale: "preview — reward diffusion alone at 1M"

  - variant: hebb_rs
    label: preview_hebb_rs
    tier: 5
    seeds: [0]
    t_max: 1000000
    rationale: "preview — (a)+(b) combined at 1M"

  - variant: seac
    label: preview_seac
    tier: 5
    seeds: [0]
    t_max: 1000000
    rationale: "preview — uniform sharing baseline at 1M"

  - variant: ippo_baseline
    label: preview_ippo_baseline
    tier: 5
    seeds: [0]
    t_max: 1000000
    rationale: "preview — no-sharing IPPO floor at 1M"
