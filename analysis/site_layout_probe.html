<!DOCTYPE html>
<!-- Layout probe for the project page. Copy into site/, serve, open in headless Edge and
     screenshot: it loads index.html in a 390px iframe and lists every element wider than the
     frame. Use this for phone widths — desktop Chrome will not lay out a window narrower than
     ~500px, so a 390px --window-size screenshot is a cropped 500px layout, not a phone view.
     Remove it from site/ afterwards. -->
<html><head><meta charset="utf-8"><title>probe</title>
<style>body{margin:0;font:13px/1.35 monospace;background:#fff;color:#000} iframe{width:390px;height:600px;border:1px solid #000;display:block} pre{white-space:pre-wrap;padding:8px}</style>
</head><body>
<iframe id="f" src="index.html"></iframe>
<pre id="out">loading…</pre>
<script>
const f = document.getElementById("f");
const out = document.getElementById("out");
function report() {
  try {
    const d = f.contentDocument, w = f.contentWindow;
    const vw = w.innerWidth, sw = d.scrollingElement.scrollWidth;
    const lines = [`innerWidth=${vw} scrollWidth=${sw} docEl.clientWidth=${d.documentElement.clientWidth}`];
    const offenders = [];
    d.querySelectorAll("body *").forEach(el => {
      const r = el.getBoundingClientRect();
      if (r.width === 0) return;
      if (r.right > vw + 1 || r.left < -1) {
        offenders.push({ right: Math.round(r.right), left: Math.round(r.left), w: Math.round(r.width),
          tag: el.tagName.toLowerCase(), cls: (el.className && el.className.baseVal === undefined ? el.className : "").toString().slice(0, 40),
          id: el.id, depth: (() => { let n = 0, p = el; while (p.parentElement) { n++; p = p.parentElement; } return n; })() });
      }
    });
    offenders.sort((a, b) => a.depth - b.depth || b.right - a.right);
    lines.push(`offenders=${offenders.length}`);
    offenders.slice(0, 40).forEach(o => lines.push(`d${o.depth} ${o.tag}#${o.id}.${o.cls} left=${o.left} right=${o.right} w=${o.w}`));
    out.textContent = lines.join("\n");
  } catch (e) { out.textContent = "probe error: " + e; }
}
f.addEventListener("load", () => setTimeout(report, 2500));
</script>
</body></html>
