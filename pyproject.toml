[tool.poetry]
name = "WiredTogether"
version = "0.1.0"
description = "Multi-agent reinforcement learning in Craftium"
authors = ["Ana Cristiana Marcu"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
# Environment + RL
gymnasium = "^0.29.1"
pettingzoo = "^1.24.3"
torch = "^2.1.0"
numpy = "^1.26.4"
scipy = "^1.11.0"
# Logging / metrics / media
# wandb >=0.18 is required for protobuf>=5 compatibility with autogen-core
wandb = ">=0.18.0"
matplotlib = "^3.8.0"
imageio = {extras = ["ffmpeg"], version = "^2.33.0"}
pillow = ">=10.0.0"
pydantic = "^2.5.0"
sentence-transformers = ">=2.2.0"
# MindForge agent dependencies
autogen-agentchat = ">=0.6.0"
autogen-core = ">=0.6.0"
autogen-ext = {extras = ["openai", "chromadb"], version = ">=0.6.0"}
openai = ">=1.0.0"
chromadb = ">=1.0.0"
# Local model + RL layer
transformers = ">=4.37.0"
peft = ">=0.10.0"
safetensors = ">=0.4.0"
# LLM server (optional)
fastapi = ">=0.100.0"
uvicorn = ">=0.20.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.12.0"
ruff = "^0.1.8"
mypy = "^1.7.0"
pre-commit = "^3.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "slow: takes >5s; excluded from a quick run with -m 'not slow'",
    "needs_game: requires the Luanti/Craftium game binary; never run locally",
    "needs_llm: requires model weights or network access",
]
addopts = "-m 'not needs_game and not needs_llm'"
